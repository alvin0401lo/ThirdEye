[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdeye-ai"
version = "0.1.0"
description = "Voice-guided visual assistance prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<2",
  "lap>=0.5.12,<1",
  "mediapipe>=0.10.14,<0.11",
  "openai>=2.0,<3",
  "opencv-python>=4.10,<4.12",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "sounddevice>=0.5,<1",
  "ultralytics>=8.4.0,<9",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
thirdeye = "thirdeye.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
